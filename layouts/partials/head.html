<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta name="author" content="{{ .Site.Params.meta.author }}">
<meta name="keywords" content="{{ .Site.Params.meta.keywords }}">

<!-- Performance optimizations -->
<meta name="theme-color" content="#2563eb">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<link rel="dns-prefetch" href="//fonts.googleapis.com">
<link rel="dns-prefetch" href="//fonts.gstatic.com">
<link rel="dns-prefetch" href="//plausible.io">
<link rel="dns-prefetch" href="//unpkg.com">
<link rel="preconnect" href="https://unpkg.com" crossorigin>

<!-- Open Graph / Facebook -->
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:title" content="{{ if .Title }}{{ .Title }} | {{ .Site.Title }}{{ else }}{{ .Site.Title }}{{ end }}">
<meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:site_name" content="{{ .Site.Title }}">

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="{{ .Permalink }}">
<meta property="twitter:title" content="{{ if .Title }}{{ .Title }} | {{ .Site.Title }}{{ else }}{{ .Site.Title }}{{ end }}">
<meta property="twitter:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">

<!-- Canonical URL -->
<link rel="canonical" href="{{ .Permalink }}">

<!-- Title -->
<title>{{ if .Title }}{{ .Title }} | {{ .Site.Title }}{{ else }}{{ .Site.Title }}{{ end }}</title>

<!-- Favicon and PWA -->
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DL Jones LLC">

<!-- Fonts with optimized loading -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Font fallback to prevent invisible text during font load */
  @font-face {
    font-family: 'Inter-fallback';
    src: local('Arial'), local('Helvetica'), local('sans-serif');
    font-display: swap;
  }
  
  /* Apply fallback font initially */
  body { font-family: 'Inter-fallback', system-ui, sans-serif; }
  
  /* Switch to Inter when loaded */
  .fonts-loaded body { font-family: 'SF Pro Text', Inter, system-ui, sans-serif; }
  .fonts-loaded h1, .fonts-loaded h2, .fonts-loaded h3, .fonts-loaded h4, .fonts-loaded h5, .fonts-loaded h6 { 
    font-family: 'SF Pro Display', Inter, system-ui, sans-serif; 
  }
</style>

<!-- Critical CSS inline - prevents FOUC -->
<style>
  /* Reset and base styles */
  html{scroll-behavior:smooth;font-size:16px}
  body{font-family:'SF Pro Text',Inter,system-ui,sans-serif;line-height:1.6;color:#111827;background-color:#ffffff;margin:0;padding:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  *,*::before,*::after{box-sizing:border-box}
  
  /* Typography */
  h1,h2,h3,h4,h5,h6{font-family:'SF Pro Display',Inter,system-ui,sans-serif;font-weight:700;line-height:1.25;margin:0;color:#111827}
  h1{font-size:3rem;line-height:1.2}
  h2{font-size:1.875rem;line-height:1.4}
  h3{font-size:1.5rem}
  p{margin:0 0 1rem;line-height:1.6}
  
  /* Links */
  a{color:#2563eb;text-decoration:none;transition:color 0.2s ease}
  a:hover{color:#1d4ed8}
  
  /* Layout utilities */
  .container{max-width:1280px;margin:0 auto;padding:0 1rem}
  .max-w-8xl{max-width:1280px}
  .mx-auto{margin-left:auto;margin-right:auto}
  .px-4{padding-left:1rem;padding-right:1rem}
  .px-6{padding-left:1.5rem;padding-right:1.5rem}
  .px-8{padding-left:2rem;padding-right:2rem}
  .py-3{padding-top:0.75rem;padding-bottom:0.75rem}
  .py-4{padding-top:1rem;padding-bottom:1rem}
  .py-20{padding-top:5rem;padding-bottom:5rem}
  .mb-4{margin-bottom:1rem}
  .mb-6{margin-bottom:1.5rem}
  .mb-8{margin-bottom:2rem}
  .mt-12{margin-top:3rem}
  
  /* Flexbox */
  .flex{display:flex}
  .flex-col{flex-direction:column}
  .items-center{align-items:center}
  .justify-center{justify-content:center}
  .justify-between{justify-content:space-between}
  .space-x-8>*+*{margin-left:2rem}
  .gap-4>*+*{margin-left:1rem}
  
  /* Text utilities */
  .text-center{text-align:center}
  .text-xl{font-size:1.25rem}
  .text-4xl{font-size:2.25rem}
  .text-gray-600{color:#6b7280}
  .text-gray-700{color:#374151}
  .text-gray-900{color:#111827}
  .text-primary{color:#2563eb}
  .font-bold{font-weight:700}
  .font-semibold{font-weight:600}
  .font-medium{font-weight:500}
  
  /* Background utilities */
  .bg-white{background-color:#ffffff}
  .bg-white\/95{background-color:rgba(255,255,255,0.95)}
  
  /* Border utilities */
  .border-b{border-bottom-width:1px}
  .border-gray-100{border-color:#f3f4f6}
  .rounded-lg{border-radius:0.5rem}
  
  /* Position utilities */
  .sticky{position:sticky}
  .top-0{top:0}
  .z-50{z-index:50}
  
  /* Size utilities */
  .h-16{height:4rem}
  .min-h-screen{min-height:100vh}
  .w-6{width:1.5rem}
  .h-6{height:1.5rem}
  .max-w-3xl{max-width:48rem}
  
  /* Display utilities */
  .hidden{display:none}
  .inline-block{display:inline-block}
  .block{display:block}
  
  /* Buttons */
  .btn-primary{background-color:#2563eb;color:#ffffff;padding:0.75rem 1.5rem;border-radius:0.5rem;font-weight:500;text-decoration:none;display:inline-block;transition:all 0.2s ease;border:none;cursor:pointer;text-align:center}
  .btn-primary:hover{background-color:#1d4ed8;text-decoration:none;color:#ffffff}
  .btn-secondary{background-color:#ffffff;color:#2563eb;border:1px solid #2563eb;padding:0.75rem 1.5rem;border-radius:0.5rem;font-weight:500;text-decoration:none;display:inline-block;transition:all 0.2s ease;cursor:pointer;text-align:center}
  .btn-secondary:hover{background-color:#eff6ff;text-decoration:none}
  
  /* Header specific */
  header{background-color:rgba(255,255,255,0.95);backdrop-filter:blur(4px);border-bottom:1px solid #f3f4f6;position:sticky;top:0;z-index:50}
  
  /* Main content */
  main{min-height:100vh}
  section{padding:5rem 0}
  
  /* Responsive utilities */
  @media (min-width: 640px){
    .sm\\:px-6{padding-left:1.5rem;padding-right:1.5rem}
    .sm\\:flex-row{flex-direction:row}
  }
  @media (min-width: 768px){
    .md\\:flex{display:flex}
    .md\\:hidden{display:none}
    .md\\:text-4xl{font-size:2.25rem}
    .md\\:text-5xl{font-size:3rem}
  }
  @media (min-width: 1024px){
    .lg\\:px-8{padding-left:2rem;padding-right:2rem}
    .lg\\:py-32{padding-top:8rem;padding-bottom:8rem}
    .lg\\:text-6xl{font-size:3.75rem}
  }
  
  /* Animation prevention during load */
  .preload *{animation-duration:0s!important;animation-delay:0s!important;transition-duration:0s!important;transition-delay:0s!important}
</style>

<!-- CSS - synchronous loading to prevent FOUC -->
{{ $css := resources.Get "css/input.css" | postCSS | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.Permalink }}" integrity="{{ $css.Data.Integrity }}">
<!-- Preload for next page navigation -->
<link rel="preload" href="{{ $css.Permalink }}" as="style" integrity="{{ $css.Data.Integrity }}">

<!-- JavaScript with preload -->
{{ $js := resources.Get "js/main.js" | js.Build | minify | fingerprint }}
<link rel="preload" href="{{ $js.Permalink }}" as="script" integrity="{{ $js.Data.Integrity }}">
<script src="{{ $js.Permalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>

<!-- Service Worker Registration -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sw.js')
        .then(function(registration) {
          console.log('SW registered: ', registration);
        })
        .catch(function(registrationError) {
          console.log('SW registration failed: ', registrationError);
        });
    });
  }
</script>

<!-- Plausible Analytics -->
{{ if .Site.Params.plausible.domain }}
<link rel="preload" href="https://plausible.io/js/script.js" as="script">
<script defer data-domain="{{ .Site.Params.plausible.domain }}" src="https://plausible.io/js/script.js"></script>
{{ end }}

<!-- Schema.org structured data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "{{ .Site.Title }}",
  "url": "{{ .Site.BaseURL }}",
  "description": "{{ .Site.Params.description }}",
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "customer service",
    "url": "{{ .Site.BaseURL }}contact/"
  },
  "sameAs": [
    {{ if .Site.Params.social.linkedin }}"{{ .Site.Params.social.linkedin }}",{{ end }}
    {{ if .Site.Params.social.twitter }}"{{ .Site.Params.social.twitter }}",{{ end }}
    {{ if .Site.Params.social.github }}"{{ .Site.Params.social.github }}"{{ end }}
  ]
}
</script>

{{ if .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ .Title }}",
  "description": "{{ if .Description }}{{ .Description }}{{ else }}{{ .Summary | truncate 160 }}{{ end }}",
  "author": {
    "@type": "Organization",
    "name": "{{ .Site.Title }}"
  },
  "publisher": {
    "@type": "Organization",
    "name": "{{ .Site.Title }}",
    "url": "{{ .Site.BaseURL }}"
  },
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
  "url": "{{ .Permalink }}"
}
</script>
{{ end }}
