<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta name="author" content="{{ .Site.Params.meta.author }}">
<meta name="keywords" content="{{ .Site.Params.meta.keywords }}">

<!-- Performance optimizations -->
<meta name="theme-color" content="#2563eb">
<meta name="color-scheme" content="light dark">
<meta name="format-detection" content="telephone=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<link rel="dns-prefetch" href="//fonts.googleapis.com">
<link rel="dns-prefetch" href="//fonts.gstatic.com">
<link rel="dns-prefetch" href="//plausible.io">
<link rel="dns-prefetch" href="//unpkg.com">
<link rel="preconnect" href="https://unpkg.com" crossorigin>

<!-- Open Graph / Facebook -->
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:title" content="{{ if .Title }}{{ .Title }} | {{ .Site.Title }}{{ else }}{{ .Site.Title }}{{ end }}">
<meta property="og:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:site_name" content="{{ .Site.Title }}">

<!-- Twitter -->
<meta property="twitter:card" content="summary_large_image">
<meta property="twitter:url" content="{{ .Permalink }}">
<meta property="twitter:title" content="{{ if .Title }}{{ .Title }} | {{ .Site.Title }}{{ else }}{{ .Site.Title }}{{ end }}">
<meta property="twitter:description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">

<!-- Canonical URL -->
<link rel="canonical" href="{{ .Permalink }}">

<!-- Title -->
<title>{{ if .Title }}{{ .Title }} | {{ .Site.Title }}{{ else }}{{ .Site.Title }}{{ end }}</title>

<!-- Favicon and PWA -->
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="manifest" href="/manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DL Jones LLC">

<!-- Fonts with optimized loading -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"></noscript>

<!-- Critical CSS inline - prevents FOUC -->
<style>
  html{scroll-behavior:smooth}body{font-family:Inter,system-ui,sans-serif;line-height:1.6;color:#111827;background-color:#ffffff;margin:0;padding:0;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}*,*::before,*::after{box-sizing:border-box}h1,h2,h3,h4,h5,h6{font-weight:600;line-height:1.25;margin:0}h1{font-size:3rem}h2{font-size:1.5rem}p{margin:0 0 1rem}a{color:#2563eb;text-decoration:none}a:hover{text-decoration:underline}.btn-primary{background-color:#2563eb;color:#fff;padding:0.75rem 1.5rem;border-radius:0.5rem;font-weight:500;text-decoration:none;display:inline-block;transition:all 0.2s;border:none;cursor:pointer}.btn-primary:hover{background-color:#1d4ed8;text-decoration:none}.glass-card{background-color:rgba(255,255,255,0.3);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.2);border-radius:0.75rem;box-shadow:0 10px 15px -3px rgba(0,0,0,0.1)}.gradient-bg{background:linear-gradient(135deg,#2563eb 0%,#3b82f6 100%)}.hero-gradient{background:linear-gradient(135deg,#f8fafc 0%,#e2e8f0 100%)}main{min-height:100vh}.font-body{font-family:Inter,system-ui,sans-serif}.text-base{font-size:1rem}.text-gray-900{color:#111827}.bg-white{background-color:#ffffff}.antialiased{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}.min-h-screen{min-height:100vh}.scroll-smooth{scroll-behavior:smooth}
</style>

<!-- CSS - synchronous loading to prevent FOUC -->
{{ $css := resources.Get "css/input.css" | postCSS | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.Permalink }}" integrity="{{ $css.Data.Integrity }}">
<!-- Preload for next page navigation -->
<link rel="preload" href="{{ $css.Permalink }}" as="style" integrity="{{ $css.Data.Integrity }}">

<!-- JavaScript with preload -->
{{ $js := resources.Get "js/main.js" | js.Build | minify | fingerprint }}
<link rel="preload" href="{{ $js.Permalink }}" as="script" integrity="{{ $js.Data.Integrity }}">
<script src="{{ $js.Permalink }}" integrity="{{ $js.Data.Integrity }}" defer></script>

<!-- Service Worker Registration -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() {
      navigator.serviceWorker.register('/sw.js')
        .then(function(registration) {
          console.log('SW registered: ', registration);
        })
        .catch(function(registrationError) {
          console.log('SW registration failed: ', registrationError);
        });
    });
  }
</script>

<!-- Plausible Analytics -->
{{ if .Site.Params.plausible.domain }}
<link rel="preload" href="https://plausible.io/js/script.js" as="script">
<script defer data-domain="{{ .Site.Params.plausible.domain }}" src="https://plausible.io/js/script.js"></script>
{{ end }}

<!-- Schema.org structured data -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "{{ .Site.Title }}",
  "url": "{{ .Site.BaseURL }}",
  "description": "{{ .Site.Params.description }}",
  "contactPoint": {
    "@type": "ContactPoint",
    "contactType": "customer service",
    "url": "{{ .Site.BaseURL }}contact/"
  },
  "sameAs": [
    {{ if .Site.Params.social.linkedin }}"{{ .Site.Params.social.linkedin }}",{{ end }}
    {{ if .Site.Params.social.twitter }}"{{ .Site.Params.social.twitter }}",{{ end }}
    {{ if .Site.Params.social.github }}"{{ .Site.Params.social.github }}"{{ end }}
  ]
}
</script>

{{ if .IsPage }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": "{{ .Title }}",
  "description": "{{ if .Description }}{{ .Description }}{{ else }}{{ .Summary | truncate 160 }}{{ end }}",
  "author": {
    "@type": "Organization",
    "name": "{{ .Site.Title }}"
  },
  "publisher": {
    "@type": "Organization",
    "name": "{{ .Site.Title }}",
    "url": "{{ .Site.BaseURL }}"
  },
  "datePublished": "{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}",
  "dateModified": "{{ .Lastmod.Format "2006-01-02T15:04:05Z07:00" }}",
  "url": "{{ .Permalink }}"
}
</script>
{{ end }}
