<header class="bg-transparent backdrop-blur-sm sticky top-0 z-50" x-data="navigation">
  <div class="max-w-8xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <div class="flex-shrink-0">
        <a href="{{ .Site.BaseURL }}" class="flex items-center space-x-2 group">
          <img src="{{ with .Site.Params.logo }}{{ . | relURL }}{{ else }}{{ "/apple-touch-icon.png" | relURL }}{{ end }}" alt="{{ .Site.Title }}" class="h-8 w-auto object-contain" />
          <span class="text-xl font-semibold text-blue-600">{{ .Site.Title }}</span>
        </a>
      </div>
      
      <!-- Desktop Navigation -->
      <nav class="hidden md:flex space-x-8">
        {{ range .Site.Menus.main }}
        <a href="{{ .URL }}" 
           class="text-gray-700 hover:text-primary transition-colors duration-200 font-medium
                  {{ if $.IsMenuCurrent "main" . }}text-primary{{ end }}">
          {{ .Name }}
        </a>
        {{ end }}
      </nav>
      
      <!-- CTA Button (Desktop & Mobile) -->
      <div class="flex">
        <a href="/contact/" class="bg-blue-600 hover:bg-blue-700 text-white hover:text-white px-4 py-2 rounded-lg font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 text-sm">
          Get Started
        </a>
      </div>
    </div>
  </div>
</header>
