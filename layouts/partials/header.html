<header class="bg-white/95 backdrop-blur-sm border-b border-gray-100 sticky top-0 z-50" x-data="navigation">
  <div class="max-w-8xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center h-16">
      <!-- Logo -->
      <div class="flex-shrink-0">
        <a href="{{ .Site.BaseURL }}" class="text-xl font-semibold text-gray-900 hover:text-primary transition-colors duration-200">
          {{ .Site.Title }}
        </a>
      </div>
      
      <!-- Desktop Navigation -->
      <nav class="hidden md:flex space-x-8">
        {{ range .Site.Menus.main }}
        <a href="{{ .URL }}" 
           class="text-gray-700 hover:text-primary transition-colors duration-200 font-medium
                  {{ if $.IsMenuCurrent "main" . }}text-primary{{ end }}">
          {{ .Name }}
        </a>
        {{ end }}
      </nav>
      
      <!-- CTA Button (Desktop) -->
      <div class="hidden md:flex">
        <a href="/contact/" class="btn-primary">
          Get Started
        </a>
      </div>
      
      <!-- Mobile menu button -->
      <div class="md:hidden">
        <button @click="toggle()" 
                class="text-gray-700 hover:text-primary focus:outline-none focus:text-primary transition-colors duration-200"
                aria-label="Toggle navigation menu">
          <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path x-show="!isOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            <path x-show="isOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>
  </div>
  
  <!-- Mobile Navigation -->
  <div x-show="isOpen" 
       x-transition:enter="transition ease-out duration-200"
       x-transition:enter-start="opacity-0 transform -translate-y-2"
       x-transition:enter-end="opacity-100 transform translate-y-0"
       x-transition:leave="transition ease-in duration-150"
       x-transition:leave-start="opacity-100 transform translate-y-0"
       x-transition:leave-end="opacity-0 transform -translate-y-2"
       class="md:hidden bg-white border-t border-gray-100">
    <div class="px-4 py-4 space-y-3">
      {{ range .Site.Menus.main }}
      <a href="{{ .URL }}" 
         @click="close()"
         class="block text-gray-700 hover:text-primary transition-colors duration-200 font-medium py-2
                {{ if $.IsMenuCurrent "main" . }}text-primary{{ end }}">
        {{ .Name }}
      </a>
      {{ end }}
      <div class="pt-4 border-t border-gray-100">
        <a href="/contact/" @click="close()" class="btn-primary w-full text-center">
          Get Started
        </a>
      </div>
    </div>
  </div>
</header>
