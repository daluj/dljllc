<!-- Additional scripts can be added here -->

<!-- Alpine.js is loaded via main.js -->

<!-- Scroll to top button -->
<button x-data="{ show: false }"
        @scroll.window="show = window.pageYOffset > 400"
        x-show="show"
        x-transition:enter="transition ease-out duration-300"
        x-transition:enter-start="opacity-0 transform scale-90"
        x-transition:enter-end="opacity-100 transform scale-100"
        x-transition:leave="transition ease-in duration-200"
        x-transition:leave-start="opacity-100 transform scale-100"
        x-transition:leave-end="opacity-0 transform scale-90"
        @click="window.scrollTo({ top: 0, behavior: 'smooth' })"
        class="fixed bottom-4 left-4 bg-primary text-white p-3 rounded-full shadow-lg hover:bg-primary-600 transition-colors duration-200 z-50"
        aria-label="Scroll to top">
  <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" />
  </svg>
</button>
