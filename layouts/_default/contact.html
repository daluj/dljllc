{{ define "main" }}
<div class="py-12">
  <div class="max-w-8xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-16">
      <!-- Contact Information -->
      <div>
        <div class="mb-12">
          <h1 class="text-4xl md:text-5xl font-bold text-gray-900 mb-6">{{ .Title }}</h1>
          <p class="text-xl text-gray-600">{{ .Description }}</p>
        </div>
        
        <div class="prose prose-lg prose-blue max-w-none">
          {{ .Content }}
        </div>
      </div>
      
      <!-- Contact Form -->
      <div class="glass-card p-8">
        <div x-data="contactForm">
          <!-- Success Message -->
          <div x-show="isSubmitted" 
               x-transition:enter="transition ease-out duration-300"
               x-transition:enter-start="opacity-0 transform scale-95"
               x-transition:enter-end="opacity-100 transform scale-100"
               class="text-center py-12">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
              <svg class="h-8 w-8 text-green-500" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
              </svg>
            </div>
            <h3 class="text-2xl font-bold text-gray-900 mb-2">Thank You!</h3>
            <p class="text-gray-600 mb-6">We've received your message and will get back to you within 24 hours.</p>
            <button @click="isSubmitted = false" class="btn-secondary">
              Send Another Message
            </button>
          </div>
          
          <!-- Contact Form -->
          <form x-show="!isSubmitted" @submit.prevent="submitForm()" class="space-y-6">  
            <!-- Name Field -->
            <div>
              <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                Full Name *
              </label>
              <input type="text" 
                     id="name" 
                     x-model="formData.name"
                     class="form-input"
                     :class="{ 'border-red-500 focus:border-red-500 focus:ring-red-500': errors.name }"
                     placeholder="Your full name">
              <p x-show="errors.name" x-text="errors.name" class="mt-1 text-sm text-red-600"></p>
            </div>
            
            <!-- Email Field -->
            <div>
              <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                Email Address *
              </label>
              <input type="email" 
                     id="email" 
                     x-model="formData.email"
                     class="form-input"
                     :class="{ 'border-red-500 focus:border-red-500 focus:ring-red-500': errors.email }"
                     placeholder="your@email.com">
              <p x-show="errors.email" x-text="errors.email" class="mt-1 text-sm text-red-600"></p>
            </div>
            
            <!-- Company Field (Optional) -->
            <div>
              <label for="company" class="block text-sm font-medium text-gray-700 mb-2">
                Company Name
              </label>
              <input type="text" 
                     id="company" 
                     x-model="formData.company"
                     class="form-input"
                     placeholder="Your company name (optional)">
            </div>
                        
            <!-- Message Field -->
            <div>
              <label for="message" class="block text-sm font-medium text-gray-700 mb-2">
                Tell us about your project *
              </label>
              <textarea id="message" 
                        rows="4" 
                        x-model="formData.message"
                        class="form-textarea"
                        :class="{ 'border-red-500 focus:border-red-500 focus:ring-red-500': errors.message }"
                        placeholder="Describe your current challenges and what you'd like to achieve..."></textarea>
              <p x-show="errors.message" x-text="errors.message" class="mt-1 text-sm text-red-600"></p>
            </div>
            
            <!-- Submit Button -->
            <div>
              <button type="submit" 
                      :disabled="isSubmitting"
                      class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-4 rounded-lg font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 w-full text-lg"
                      :class="{ 'opacity-50 cursor-not-allowed': isSubmitting }"
                      id="submit-btn">
                <span x-show="!isSubmitting">Send Message</span>
                <span x-show="isSubmitting" class="flex items-center justify-center">
                  <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                  </svg>
                  Sending...
                </span>
              </button>
            </div>
            
            <!-- Error Message -->
            <div x-show="errors.submit" class="bg-red-50 border border-red-200 rounded-lg p-4">
              <p class="text-red-600" x-text="errors.submit"></p>
            </div>
            
            <!-- Privacy Notice -->
            <div class="text-sm text-gray-500">
              <p>By submitting this form, you agree to our <a href="/privacy/" class="text-primary hover:text-primary-600">Privacy Policy</a>. We'll never share your information with third parties.</p>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{{ end }}
