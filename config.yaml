baseURL: 'https://dljllc.pages.dev/'
languageCode: 'en-us'
title: 'DLJ'

# Hugo modules for Plausible Analytics
module:
  imports:
    - path: github.com/divinerites/plausible-hugo

# Plausible Analytics configuration
params:
  plausible:
    domain: 'dljllc.pages.dev'
    script: 'https://plausible.io/js/script.js'
  
  # Site parameters
  description: 'AI and Automation consulting for logistics, travel, restaurants, language education, and health industries'
  author: 'DLJ LLC'
  
  # Design system colors
  colors:
    primary: '#2563eb'
    neutral_white: '#FFFFFF'
    neutral_light: '#F7F7F7'
    neutral_gray: '#D1D5DB'
    neutral_dark: '#6B7280'

# Multilingual configuration
languages:
  en:
    languageName: 'English'
    weight: 1
    title: 'DLJ LLC - Tech Consulting'
    params:
      description: 'AI and Automation consulting for logistics, travel, restaurants, language education, and health industries'
  es:
    languageName: 'Español'
    weight: 2
    title: 'DLJ LLC - Consultoría Tecnológica'
    params:
      description: 'Consultoría en IA y Automatización para logística, viajes, restaurantes, educación de idiomas y salud'

# Menu configuration
# menu:
#  main:
#    - name: 'Services'
#      url: '/services/'
#      weight: 1

# Pagination
pagination:
  pagerSize: 6
  path: "page"

# Markup configuration
markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: 'github'
    lineNos: true

# SEO and performance
params:
  meta:
    author: 'DLJ LLC'
    description: 'Streamline your operations with AI-powered solutions. Expert consulting in automation, apps, and business tools.'
    keywords: 'AI consulting, automation, business tools, logistics, travel, restaurants, language education, health'
  
  # Social media
  social:
    twitter: ''
    linkedin: ''
    github: ''

# Build configuration
build:
  writeStats: true
  
# Minification and optimization
minify:
  disableCSS: false
  disableHTML: false
  disableJS: false
  disableJSON: false
  disableSVG: false
  disableXML: false
  minifyOutput: true
  tdewolff:
    html:
      keepDocumentTags: true
      keepEndTags: true
      keepDefaultAttrVals: true
      keepWhitespace: false
    css:
      keepCSS2: true
      precision: 0
    js:
      keepVarNames: false
      precision: 0
    json:
      precision: 0
    svg:
      precision: 0
    xml:
      keepWhitespace: false

# Image processing
imaging:
  hint: photo
  quality: 85
  resampleFilter: lanczos
  anchor: smart
  
# Output formats
outputs:
  home: ["HTML", "RSS", "JSON"]
  page: ["HTML"]
  section: ["HTML", "RSS"]
  
# Caching
caches:
  getjson:
    maxAge: "10m"
  getcsv:
    maxAge: "10m"
  images:
    maxAge: "1h"
  assets:
    maxAge: "1h"
  modules:
    maxAge: "10m"

# Security
security:
  exec:
    allow:
      - '^dart-sass-embedded$'
      - '^go$'
      - '^npx$'
      - '^postcss$'
  funcs:
    getenv:
      - '^HUGO_'
      - '^WC_'